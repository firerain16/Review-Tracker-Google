name: Daily Google Reviews Tracker

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  track-reviews:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Review Tracker Script
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          BUSINESS_URL: ${{ secrets.BUSINESS_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python tracker.py

      - name: Save updated snapshot to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reviews_data.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update review snapshot [skip ci]"
          git push
